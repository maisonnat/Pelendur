<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelendur HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-tauri-drag-region>
<div id="hud-container" class="hud-container" data-tauri-drag-region>
    <!-- Minimal mode icon -->
    <div id="minimal-icon" class="minimal-icon hidden" title="Click to expand HUD">
      <span class="pl-minimal-dot"></span>
    </div>

    <!-- Control bar -->
    <div class="pl-control-bar" data-tauri-drag-region>
      <div class="pl-control-bar__left">
        <button id="profile-btn" class="pl-btn pl-btn--icon" title="Open Profile Management">Profile</button>
      </div>
      <div class="pl-control-bar__right">
        <button id="audio-source-btn" class="pl-btn pl-btn--icon" title="Select Audio Source">🎧</button>
        <button id="interview-btn" class="pl-btn pl-btn--icon interview-btn" title="Start Interview Mode">🎙️</button>
        <button id="minimal-btn" class="pl-btn pl-btn--icon" title="Toggle Minimal Mode">🔘</button>
        <button id="lock-btn" class="pl-btn pl-btn--icon" title="Lock/Unlock Click-through (Ctrl+Alt+L)">🔓</button>
        <button id="clear-btn" class="pl-btn pl-btn--icon" title="Clear Feed">🗑️</button>
        <button id="regenerate-btn" class="pl-btn pl-btn--icon" title="Regenerate Last Suggestion">🔄</button>
        <button id="close-btn" class="pl-btn pl-btn--icon" title="Close Pelendur">✕</button>
        <span id="status-indicator" class="pl-status-dot pl-status-dot--idle"></span>
      </div>
    </div>

    <!-- System status bar -->
    <div id="pl-system-status" class="pl-system-status pl-system-status--loading">
      <span class="pl-system-item" data-component="stt"><span class="pl-status-dot"></span> STT</span>
      <span class="pl-system-item" data-component="llm"><span class="pl-status-dot"></span> LLM</span>
      <span class="pl-system-item" data-component="kg"><span class="pl-status-dot"></span> KG</span>
    </div>

    <!-- Interview status bar -->
    <div id="interview-status-bar" class="pl-status-bar hidden">
      <span class="pl-badge">🎙️ Interview Active</span>
      <span id="interview-company-display" class="pl-status-bar__company">—</span>
      <span id="interview-timer" class="pl-status-bar__timer">00:00</span>
    </div>

    <!-- Knowledge panel -->
    <div id="knowledge-panel" class="knowledge-panel hidden">
      <div class="panel-header">
        <span class="icon">🧠</span>
        <span>Contexto</span>
        <button onclick="toggleKnowledgePanel()" class="toggle-btn">−</button>
      </div>
      
      <div class="panel-content">
        <div class="context-section" id="relevant-skills"></div>
        
        <div class="context-section collapsible" id="relevant-stories">
          <div class="section-header" onclick="toggleSection('stories')">
            ⭐ Historias (0)
          </div>
          <div class="section-content hidden" id="stories-content"></div>
        </div>
      </div>
    </div>

    <!-- Company selector modal -->
    <div id="company-modal-overlay" class="pl-modal-overlay hidden"></div>
    <div id="company-modal" class="pl-modal hidden">
      <div class="pl-modal-header">
        <span>🎙️ Start Interview</span>
        <button id="close-company-modal-btn" class="pl-modal-close">&times;</button>
      </div>
      <div class="pl-modal-body">
        <label class="pl-modal-label">Select Company:</label>
        <div id="company-list" class="pl-company-list">
          <div class="loading-text">Loading companies...</div>
        </div>
        <div class="pl-company-custom">
          <label class="pl-modal-label">Or type a custom company:</label>
          <div class="pl-input-row">
            <input type="text" id="custom-company-input" class="pl-input" placeholder="e.g., CrowdStrike, Google, ..." />
            <button id="start-with-custom-btn" class="pl-btn pl-btn--primary">Start</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Summary modal -->
    <div id="summary-modal-overlay" class="pl-modal-overlay hidden"></div>
    <div id="summary-modal" class="pl-modal pl-modal--wide hidden">
      <div class="pl-modal-header">
        <span>📋 Interview Summary</span>
        <button id="close-summary-modal-btn" class="pl-modal-close">&times;</button>
      </div>
      <div id="summary-content" class="pl-modal-body">
        <div class="loading-text">Generating summary...</div>
      </div>
    </div>

    <!-- Process selector modal -->
    <div id="modal-overlay" class="pl-modal-overlay hidden"></div>
    <div id="process-modal" class="pl-modal hidden">
      <div class="pl-modal-header">
        <span>Select Audio Source</span>
        <button id="close-modal-btn" class="pl-modal-close">&times;</button>
      </div>
      <div id="process-list" class="process-list">
        <!-- Processes populated here -->
      </div>
    </div>

    <div class="main-content" data-tauri-drag-region>
      <!-- Context bar -->
      <div id="knowledge-context-bar" class="context-bar hidden">
        <span id="context-indicator" class="context-indicator"></span>
        <div id="skill-tags" class="skill-tags"></div>
      </div>

      <!-- Main suggestion card -->
      <div id="suggestions-feed" class="suggestions-feed" data-tauri-drag-region>
        <div class="pl-card--suggestion" data-tauri-drag-region>
          <div class="pl-card__content" id="main-suggestion">Cargando Pelendur...</div>
        </div>
      </div>

      <!-- Partial transcription -->
      <div id="partial-transcription" class="pl-partial-hidden"></div>

      <!-- Transcription feed -->
      <div id="transcription-feed" class="transcription-feed" data-tauri-drag-region>
        <!-- Transcribed text appears here -->
      </div>
    </div>
  </div>
  
  <script src="main.js"></script>
</body>
</html>
