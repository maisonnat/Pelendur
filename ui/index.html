<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelendur HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-tauri-drag-region>
<div id="hud-container" class="hud-container" data-tauri-drag-region>
    <!-- Minimal mode icon (visible when minimal) -->
    <div id="minimal-icon" class="minimal-icon hidden" title="Click to expand HUD">
      <span class="minimal-dot"></span>
    </div>

    <button id="profile-btn" class="profile-btn icon-btn" title="Open Profile Management">Profile</button>
    <div class="controls" data-tauri-drag-region>
      <button id="audio-source-btn" class="icon-btn" title="Select Audio Source">🎧</button>
      <button id="interview-btn" class="icon-btn interview-btn" title="Start Interview Mode">🎙️</button>
      <button id="minimal-btn" class="icon-btn" title="Toggle Minimal Mode (compact icon)">🔘</button>
      <button id="lock-btn" class="icon-btn" title="Lock/Unlock Click-through (Ctrl+Alt+L)">🔓</button>
      <button id="clear-btn" class="icon-btn" title="Clear Feed">🗑️</button>
      <button id="regenerate-btn" class="icon-btn" title="Regenerate Last Suggestion">🔄</button>
      <button id="close-btn" class="icon-btn" title="Close Pelendur">✕</button>
      <div id="status-indicator" class="status-indicator">●</div>
    </div>

    <!-- Interview status bar (shown when interview is active) -->
    <div id="interview-status-bar" class="interview-status-bar hidden">
      <span class="interview-badge">🎙️ Interview Active</span>
      <span id="interview-company-display" class="interview-company-display">—</span>
      <span id="interview-timer" class="interview-timer">00:00</span>
    </div>

    <div id="knowledge-panel" class="knowledge-panel hidden">
      <div class="panel-header">
        <span class="icon">🧠</span>
        <span>Contexto</span>
        <button onclick="toggleKnowledgePanel()" class="toggle-btn">−</button>
      </div>
      
      <div class="panel-content">
        <div class="context-section" id="relevant-skills"></div>
        
        <div class="context-section collapsible" id="relevant-stories">
          <div class="section-header" onclick="toggleSection('stories')">
            ⭐ Historias (0)
          </div>
          <div class="section-content hidden" id="stories-content"></div>
        </div>
      </div>
    </div>

    <!-- Company Selector Modal (for starting interview) -->
    <div id="company-modal-overlay" class="modal-overlay hidden"></div>
    <div id="company-modal" class="modal hidden">
      <div class="modal-header">
        <span>🎙️ Start Interview</span>
        <button id="close-company-modal-btn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <label class="modal-label">Select Company:</label>
        <div id="company-list" class="company-list">
          <div class="loading-text">Loading companies...</div>
        </div>
        <div class="company-custom-row">
          <label class="modal-label">Or type a custom company:</label>
          <div class="company-input-row">
            <input type="text" id="custom-company-input" class="company-input" placeholder="e.g., CrowdStrike, Google, ..." />
            <button id="start-with-custom-btn" class="primary-btn">Start</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Summary Modal (appears when interview ends) -->
    <div id="summary-modal-overlay" class="modal-overlay hidden"></div>
    <div id="summary-modal" class="modal modal-wide hidden">
      <div class="modal-header">
        <span>📋 Interview Summary</span>
        <button id="close-summary-modal-btn" class="close-btn">&times;</button>
      </div>
      <div id="summary-content" class="modal-body summary-body">
        <div class="loading-text">Generating summary...</div>
      </div>
    </div>

    <!-- Process Selector Modal -->
    <div id="modal-overlay" class="modal-overlay hidden"></div>
    <div id="process-modal" class="modal hidden">
      <div class="modal-header">
        <span>Select Audio Source</span>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>
      <div id="process-list" class="process-list">
        <!-- Processes populated here -->
      </div>
    </div>

    <div class="main-content" data-tauri-drag-region>
      <div id="knowledge-context-bar" class="context-bar hidden">
        <span id="context-indicator" class="context-indicator"></span>
        <div id="skill-tags" class="skill-tags"></div>
      </div>
      <div id="suggestions-feed" class="suggestions-feed" data-tauri-drag-region>
        <div class="suggestion-card" data-tauri-drag-region>
          <div class="card-content" id="main-suggestion">Cargando Pelendur...</div>
        </div>
      </div>

      <div id="partial-transcription" class="partial-transcription partial-hidden"></div>

      <div id="transcription-feed" class="transcription-feed" data-tauri-drag-region>
        <!-- Transcribed text appears here -->
      </div>
    </div>
  </div>
  
  <script src="main.js"></script>
</body>
</html>
