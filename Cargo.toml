[package]
name = "ghostai-pilot"
version = "0.1.0"
edition = "2021"
description = "GhostAI pilot — real-time system audio → STT → LLM pipeline"

[features]
default = ["audio"]
audio = ["cpal", "wasapi"]

[dependencies]
cpal = { version = "0.15", optional = true }
wasapi = { version = "0.23", optional = true }
sysinfo = "0.35"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
dotenvy = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
